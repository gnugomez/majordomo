name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Maintains the release PR from conventional commits; merging that PR
  # creates the vX.Y.Z tag and the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  # When a release was just created: build the signed .app and attach it.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A stable signing identity (even self-signed) keeps macOS permissions
      # for the app across releases; without the secret we fall back to
      # ad-hoc, which resets them on every update.
      - name: Import signing certificate
        if: env.MACOS_SIGN_P12 != ''
        run: |
          echo "$MACOS_SIGN_P12" | base64 -d > sign.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import sign.p12 -k build.keychain -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain build.keychain
          rm sign.p12
          echo "CODESIGN_IDENTITY=Majordomo Dev" >> "$GITHUB_ENV"

      - name: Package
        run: npm run package

      - name: Attach Majordomo.app to the release
        run: |
          ditto -c -k --keepParent release/Majordomo-darwin-arm64/Majordomo.app Majordomo-darwin-arm64.zip
          gh release upload "${{ needs.release-please.outputs.tag_name }}" Majordomo-darwin-arm64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
