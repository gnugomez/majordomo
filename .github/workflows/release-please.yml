name: Release

on:
  push:
    branches: [main]
  # Rebuild and re-attach artifacts for an existing release (e.g. after a
  # workflow fix) without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build artifacts for (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Maintains the release PR from conventional commits; merging that PR
  # creates the vX.Y.Z tag and the GitHub release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  # When a release was just created: build the signed .app and attach a DMG.
  # Apple silicon only for now — the SPM build targets the runner's arch.
  build-macos:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    permissions:
      contents: write
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5

      # A stable signing identity (even self-signed) keeps macOS permissions
      # for the app across releases; without the secret we fall back to
      # ad-hoc, which resets them on every update.
      - name: Import signing certificate
        if: env.MACOS_SIGN_P12 != ''
        run: |
          echo "$MACOS_SIGN_P12" | base64 -d > sign.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import sign.p12 -k build.keychain -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain build.keychain
          # Self-signed: codesign only accepts identities the system trusts.
          /usr/bin/openssl pkcs12 -in sign.p12 -passin env:MACOS_SIGN_P12_PASSWORD -nokeys -clcerts -out cert.pem
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain cert.pem
          # Whatever identity the P12 carries — never assume its name.
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          test -n "$IDENTITY"
          rm sign.p12 cert.pem
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package
        run: ./scripts/bundle.sh

      - name: Attach the DMG to the release
        run: |
          hdiutil create -volname Majordomo -srcfolder dist/Majordomo.app -ov -format UDZO Majordomo-macos-arm64.dmg
          gh release upload --clobber "$RELEASE_TAG" Majordomo-macos-arm64.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Points the Homebrew tap's cask at this release. Skipped when the tap
      # deploy key isn't configured (write deploy key on gnugomez/homebrew-tap).
      - name: Publish the Homebrew tap
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          SHA=$(shasum -a 256 Majordomo-macos-arm64.dmg | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:gnugomez/homebrew-tap.git tap
          cat > tap/Casks/majordomo.rb <<CASK
          # This cask is regenerated by the release workflow in gnugomez/majordomo on
          # every release — don't edit version/sha256 by hand.
          cask "majordomo" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/gnugomez/majordomo/releases/download/v#{version}/Majordomo-macos-arm64.dmg"
            name "Majordomo"
            desc "Menu-bar inbox for GitHub and GitLab notifications"
            homepage "https://github.com/gnugomez/majordomo"

            depends_on macos: :tahoe
            depends_on arch: :arm64

            app "Majordomo.app"

            zap trash: [
              "~/Library/Application Support/Majordomo",
              "~/Library/Preferences/dev.majordomo.app.plist",
            ]

            caveats <<~EOS
              Majordomo is not notarized: install with --no-quarantine, or allow it
              under System Settings → Privacy & Security after the first launch.
            EOS
          end
          CASK
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/majordomo.rb
          git diff --cached --quiet || git commit -m "majordomo $VERSION"
          git push
