name: Release

on:
  push:
    branches: [main]
  # Rebuild and re-attach artifacts for an existing release (e.g. after a
  # workflow fix) without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build artifacts for (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Maintains the release PR from conventional commits; merging that PR
  # creates the vX.Y.Z tag and the GitHub release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  # When a release was just created: build the signed .app and attach a DMG.
  # Apple silicon only for now — the SPM build targets the runner's arch.
  build-macos:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    permissions:
      contents: write
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      # A stable signing identity (even self-signed) keeps macOS permissions
      # for the app across releases; without the secret we fall back to
      # ad-hoc, which resets them on every update.
      - name: Import signing certificate
        if: env.MACOS_SIGN_P12 != ''
        run: |
          echo "$MACOS_SIGN_P12" | base64 -d > sign.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import sign.p12 -k build.keychain -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain build.keychain
          # Self-signed: codesign only accepts identities the system trusts.
          /usr/bin/openssl pkcs12 -in sign.p12 -passin env:MACOS_SIGN_P12_PASSWORD -nokeys -clcerts -out cert.pem
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain cert.pem
          # Whatever identity the P12 carries — never assume its name.
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          test -n "$IDENTITY"
          rm sign.p12 cert.pem
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package
        run: ./scripts/bundle.sh

      - name: Attach the DMG to the release
        run: |
          hdiutil create -volname Majordomo -srcfolder dist/Majordomo.app -ov -format UDZO Majordomo-macos-arm64.dmg
          gh release upload --clobber "${{ needs.release-please.outputs.tag_name || inputs.tag }}" Majordomo-macos-arm64.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
