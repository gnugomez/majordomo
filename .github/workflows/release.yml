name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # macOS runner because a publish run also packages the .app artifact.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # With pending changesets: opens/updates the "Version Packages" PR.
      # Without (i.e. that PR just merged): tags vX.Y.Z and creates the
      # GitHub release from the changelog.
      - name: Version or tag
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset tag
          commit: "chore: version release"
          title: "chore: version release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and attach Majordomo.app
        if: steps.changesets.outputs.published == 'true'
        run: |
          npm run package
          ditto -c -k --keepParent release/Majordomo-darwin-arm64/Majordomo.app Majordomo-darwin-arm64.zip
          gh release upload "v$(node -p "require('./package.json').version")" Majordomo-darwin-arm64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
